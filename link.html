                    toggleIcon.title = templateToggleAltHide;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful, hashedPassword } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (isSuccessful && hashedPassword) {
                    try { sessionStorage.setItem(SESSION_KEY, hashedPassword); } catch (e) {}
                }

                if (!isSuccessful) {
                    alert(templateError);
                }
            });
        </script>
    <script>
(function () {
  function fit() {
    var t = document.querySelector('.staticrypt-title'), a = t && t.querySelector('.ad'), w = t && t.parentNode.clientWidth;
    if (!a || !w) return;
    t.style.fontSize = '100px';
    t.style.fontSize = (100 * w / a.getBoundingClientRect().width) + 'px';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('load', fit); window.addEventListener('resize', fit);
  new MutationObserver(fit).observe(document.getElementById('staticrypt_content'), { attributes: true, attributeFilter: ['class'] });
})();
</script>
