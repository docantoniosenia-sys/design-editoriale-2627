    var t = document.querySelector('.staticrypt-title'), a = t && t.querySelector('.ad'), w = t && t.parentNode.clientWidth;
    if (!a || !w) return;
    t.style.fontSize = '100px';
    t.style.fontSize = (100 * w / a.getBoundingClientRect().width) + 'px';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('load', fit); window.addEventListener('resize', fit);
  new MutationObserver(fit).observe(document.getElementById('staticrypt_content'), { attributes: true, attributeFilter: ['class'] });
})();
</script>
</body>
</html>
